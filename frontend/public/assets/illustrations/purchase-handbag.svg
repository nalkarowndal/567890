<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="bagLeatherGrad" x1="24" y1="26" x2="56" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="30%" stop-color="#2563EB"/>
      <stop offset="70%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bagFlapGrad" x1="28" y1="30" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bagGoldHardware" x1="36" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="bagShadow" x="12" y="10" width="56" height="66" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Soft Radial Aura -->
  <circle cx="40" cy="44" r="30" fill="#DBEAFE" fill-opacity="0.6"/>

  <!-- Leather Handle -->
  <g filter="url(#bagShadow)">
    <path d="M28 32 C28 16 52 16 52 32" stroke="#1E40AF" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 32 C28 17 52 17 52 32" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <!-- Metallic Handle Rings -->
    <circle cx="28" cy="32" r="3" fill="url(#bagGoldHardware)"/>
    <circle cx="52" cy="32" r="3" fill="url(#bagGoldHardware)"/>
  </g>

  <!-- Bag Main Body -->
  <g filter="url(#bagShadow)">
    <!-- Trapezoid Body -->
    <path d="M22 35 L58 35 L62 66 C62 68 60 70 57 70 L23 70 C20 70 18 68 18 66 Z" fill="url(#bagLeatherGrad)"/>
    
    <!-- Top Flap -->
    <path d="M22 35 L58 35 L55 51 C55 53 52 54 49 54 L31 54 C28 54 25 53 25 51 Z" fill="url(#bagFlapGrad)"/>
    
    <!-- Subtle Edge Stitching Lines -->
    <path d="M24 37 L56 37 L53 50 C51 51 49 52 47 52 L33 52 C31 52 29 51 27 50 Z" stroke="#93C5FD" stroke-width="0.8" stroke-dasharray="2 1.5" stroke-opacity="0.6"/>
    <path d="M21 67 L59 67" stroke="#1E3A8A" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Luxury Clasp / Lock -->
    <rect x="37" y="48" width="6" height="8" rx="2" fill="url(#bagGoldHardware)"/>
    <rect x="38.5" y="50" width="3" height="4" rx="1" fill="#78350F"/>
    
    <!-- Padlock or Clochette Charm Tag -->
    <path d="M52 35 Q56 42 56 48" stroke="#1E3A8A" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="54" y="47" width="5" height="7" rx="1.5" fill="url(#bagGoldHardware)"/>
  </g>

  <!-- Luxury Shine Sparkle -->
  <path d="M60 22 L61 25 L64 26 L61 27 L60 30 L59 27 L56 26 L59 25 Z" fill="#F59E0B" opacity="0.95"/>
  <circle cx="20" cy="40" r="1.5" fill="#60A5FA"/>
</svg>
