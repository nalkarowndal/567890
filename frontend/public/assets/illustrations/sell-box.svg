<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="sellBoxGrad" x1="20" y1="28" x2="60" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="sellLidGrad" x1="16" y1="26" x2="64" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sellGoldRibbon" x1="24" y1="12" x2="56" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="sellBoxShadow" x="12" y="10" width="56" height="66" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#064E3B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Soft Radial Aura -->
  <circle cx="40" cy="44" r="30" fill="#D1FAE5" fill-opacity="0.6"/>

  <g filter="url(#sellBoxShadow)">
    <!-- Box Bottom Body -->
    <path d="M22 36 L58 36 L56 68 C56 70 54 71 52 71 L28 71 C26 71 24 70 24 68 Z" fill="url(#sellBoxGrad)"/>
    
    <!-- Vertical Ribbon on Body -->
    <rect x="37" y="36" width="6" height="35" fill="url(#sellGoldRibbon)"/>

    <!-- Box Lid -->
    <rect x="18" y="27" width="44" height="11" rx="3" fill="url(#sellLidGrad)"/>
    <!-- Horizontal Ribbon on Lid -->
    <rect x="18" y="30.5" width="44" height="4" fill="url(#sellGoldRibbon)"/>
    <!-- Vertical Ribbon on Lid -->
    <rect x="37" y="27" width="6" height="11" fill="url(#sellGoldRibbon)"/>

    <!-- Luxury Ribbon Bow -->
    <!-- Left Loop -->
    <path d="M40 25 C34 16 23 20 28 26 C32 29 38 27 40 27 Z" fill="url(#sellGoldRibbon)"/>
    <path d="M38 24.5 C34 18 26 21 30 25 Z" fill="#FDE68A" opacity="0.6"/>
    <!-- Right Loop -->
    <path d="M40 25 C46 16 57 20 52 26 C48 29 42 27 40 27 Z" fill="url(#sellGoldRibbon)"/>
    <path d="M42 24.5 C46 18 54 21 50 25 Z" fill="#FDE68A" opacity="0.6"/>
    <!-- Center Knot -->
    <circle cx="40" cy="26" r="3.5" fill="#F59E0B"/>
    <circle cx="40" cy="26" r="2" fill="#FEF3C7"/>

    <!-- Hanging Ribbon Tails -->
    <path d="M38 28 Q33 36 31 42" stroke="url(#sellGoldRibbon)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M42 28 Q47 36 49 42" stroke="url(#sellGoldRibbon)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Luxury Quality Seal Badge -->
  <circle cx="53" cy="54" r="6" fill="#F59E0B"/>
  <circle cx="53" cy="54" r="4.5" fill="#FDE68A"/>
  <path d="M51 54 L52.5 55.5 L55.5 52.5" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle Accent -->
  <path d="M22 20 L23.5 23 L26.5 24 L23.5 25 L22 28 L20.5 25 L17.5 24 L20.5 23 Z" fill="#F59E0B" opacity="0.95"/>
</svg>
