    <path d="M22 13 L28 15 L36 15 L42 13 L47 24 L42 27 L44 52 C44 53 43 54 41 54 L23 54 C21 54 20 53 20 52 L22 27 L17 24 Z" fill="url(#curCoatCamel)"/>
    
