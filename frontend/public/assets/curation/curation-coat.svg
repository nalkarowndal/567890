    <path d="M36 15 L32 28 L41 20 Z" fill="url(#curCoatLapel)"/>

    <!-- Double Breasted Buttons -->
    <circle cx="28" cy="33" r="1.5" fill="#FDE68A"/>
    <circle cx="36" cy="33" r="1.5" fill="#FDE68A"/>
    <circle cx="28" cy="40" r="1.5" fill="#FDE68A"/>
    <circle cx="36" cy="40" r="1.5" fill="#FDE68A"/>

    <!-- Trench Coat Belt with Buckle -->
    <rect x="21" y="35" width="22" height="3" rx="1.5" fill="#92400E"/>
    <rect x="29" y="34" width="6" height="5" rx="1.5" stroke="#FDE68A" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M47 12 L48.5 15 L51.5 16.5 L48.5 18 L47 21 L45.5 18 L42.5 16.5 L45.5 15 Z" fill="#F59E0B"/>
