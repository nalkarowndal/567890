<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="curRingGold" x1="16" y1="20" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="curDiamondFacet" x1="24" y1="12" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0E7FF"/>
      <stop offset="70%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="curJewelDrop" x="10" y="8" width="44" height="50" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#curJewelDrop)">
    <!-- Gold Ring Band -->
    <ellipse cx="32" cy="38" rx="16" ry="14" stroke="url(#curRingGold)" stroke-width="4.5"/>
    <ellipse cx="32" cy="38" rx="16" ry="14" stroke="#FEF08A" stroke-width="1.2" stroke-dasharray="20 40"/>

    <!-- Brilliant Cut Solitaire Diamond Gem -->
    <!-- Diamond Top Crown Facets -->
    <path d="M26 18 L38 18 L43 23 L21 23 Z" fill="url(#curDiamondFacet)" stroke="#C7D2FE" stroke-width="0.8"/>
    <polygon points="26,18 31,18 32,23 27,23" fill="#FFFFFF" opacity="0.8"/>
    <polygon points="33,18 38,18 37,23 32,23" fill="#E0E7FF" opacity="0.9"/>
    
    <!-- Diamond Pavilion (Bottom Cone) -->
    <path d="M21 23 L43 23 L32 35 Z" fill="url(#curDiamondFacet)" stroke="#C7D2FE" stroke-width="0.8"/>
    <polygon points="27,23 37,23 32,35" fill="#C7D2FE" opacity="0.6"/>
    <polygon points="21,23 27,23 32,35" fill="#818CF8" opacity="0.4"/>
    <polygon points="37,23 43,23 32,35" fill="#93C5FD" opacity="0.5"/>

    <!-- Prongs / Claws -->
    <circle cx="21" cy="23" r="1.5" fill="#F59E0B"/>
    <circle cx="43" cy="23" r="1.5" fill="#F59E0B"/>
  </g>

  <!-- Big Sparkle Star -->
  <path d="M42 10 L44 14 L48 16 L44 18 L42 22 L40 18 L36 16 L40 14 Z" fill="#FDE047"/>
  <circle cx="20" cy="14" r="1.5" fill="#FDE047"/>
  <circle cx="47" cy="30" r="1.2" fill="#E0E7FF"/>
</svg>
