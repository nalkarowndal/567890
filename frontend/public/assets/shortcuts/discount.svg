<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scTagPink" x1="12" y1="12" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="scTagGold" x1="26" y1="8" x2="42" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="scTagDrop" x="6" y="6" width="36" height="38" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#BE123C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#scTagDrop)">
    <!-- Back Discount Coupon Card -->
    <rect x="18" y="10" width="22" height="15" rx="3" transform="rotate(15 18 10)" fill="url(#scTagGold)" opacity="0.8"/>
    
    <!-- Main Angled Luxury Price Tag -->
    <path d="M12 21 L22 11 L35 24 L25 34 Z" fill="url(#scTagPink)"/>
    <!-- Tag Eyelet -->
    <circle cx="17" cy="16" r="2.2" fill="#FFFFFF"/>
    <circle cx="17" cy="16" r="1.2" fill="#BE123C"/>
    <!-- String from Tag -->
    <path d="M16 15 C14 11 11 9 9 10" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Percentage Symbol on Tag -->
    <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
      <line x1="28" y1="19" x2="21" y2="28"/>
      <circle cx="23" cy="20" r="1" fill="#FFFFFF"/>
      <circle cx="26" cy="27" r="1" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
