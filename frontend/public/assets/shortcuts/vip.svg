<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scCrownGold" x1="10" y1="14" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="scCrownJewel" x1="20" y1="28" x2="28" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <filter id="scCrownDrop" x="6" y="10" width="36" height="32" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#B45309" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#scCrownDrop)">
    <!-- Crown Base Band -->
    <path d="M12 33 L36 33 L35 37 L13 37 Z" fill="url(#scCrownGold)"/>
    <circle cx="16" cy="35" r="1.2" fill="#FFFFFF"/>
    <circle cx="24" cy="35" r="1.5" fill="url(#scCrownJewel)"/>
    <circle cx="32" cy="35" r="1.2" fill="#FFFFFF"/>

    <!-- Crown Peaks -->
    <path d="M11 20 L16 32 L32 32 L37 20 L29 25 L24 15 L19 25 Z" fill="url(#scCrownGold)"/>
    
    <!-- Crown Jewels on Peaks -->
    <circle cx="11" cy="19" r="2.2" fill="#FDE047"/>
    <circle cx="19" cy="25" r="1.5" fill="#FFFFFF"/>
    <circle cx="24" cy="14" r="2.8" fill="#FEF08A"/>
    <circle cx="29" cy="25" r="1.5" fill="#FFFFFF"/>
    <circle cx="37" cy="19" r="2.2" fill="#FDE047"/>
  </g>

  <!-- Sparkle Accents -->
  <path d="M24 7 L24.8 9 L27 9.8 L24.8 10.6 L24 12.8 L23.2 10.6 L21 9.8 L23.2 9 Z" fill="#FDE047"/>
  <circle cx="38" cy="11" r="1.2" fill="#FDE047"/>
</svg>
