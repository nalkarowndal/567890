<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scHangerGold" x1="16" y1="10" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="scDressPink" x1="18" y1="22" x2="30" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="scDrop" x="6" y="6" width="36" height="38" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#scDrop)">
    <!-- Hanger Hook -->
    <path d="M24 10 C22 10 20.5 11.5 20.5 13.5 C20.5 16 24 17 24 19.5" stroke="url(#scHangerGold)" stroke-width="2" stroke-linecap="round"/>
    <!-- Hanger Triangle -->
    <path d="M12 24 L24 19.5 L36 24 L24 23.5 Z" fill="url(#scHangerGold)"/>
    
    <!-- Mini Dress Silhouette -->
    <path d="M20 23 L22 30 L16 41 C19 42 29 42 32 41 L26 30 L28 23 Z" fill="url(#scDressPink)" opacity="0.95"/>
    <!-- Dress Ribbon Belt -->
    <rect x="21" y="29" width="6" height="1.8" rx="0.9" fill="#FDE047"/>
  </g>
  <!-- Mini Sparkle -->
  <path d="M35 12 L36 14.5 L38.5 15.5 L36 16.5 L35 19 L34 16.5 L31.5 15.5 L34 14.5 Z" fill="#F59E0B"/>
</svg>
