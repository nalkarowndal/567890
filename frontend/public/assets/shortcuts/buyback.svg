<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scBbLoop" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="scBbBag" x1="16" y1="16" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="scBbDrop" x="6" y="6" width="36" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#047857" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#scBbDrop)">
    <!-- Circulation Loop Arrows (Top right to bottom left & vice versa) -->
    <path d="M24 8 C32 8 38 14 38 22 C38 24 37.5 26 36.5 28" stroke="url(#scBbLoop)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M34 29 L37 28 L39 31" fill="url(#scBbLoop)"/>

    <path d="M24 40 C16 40 10 34 10 26 C10 24 10.5 22 11.5 20" stroke="url(#scBbLoop)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M14 19 L11 20 L9 17" fill="url(#scBbLoop)"/>

    <!-- Center Mini Handbag -->
    <!-- Handle -->
    <path d="M21 21 C21 17 27 17 27 21" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M18 22 L30 22 L32 33 C32 34 31 35 29 35 L19 35 C17 35 16 34 16 33 Z" fill="url(#scBbBag)"/>
    <!-- Clasp -->
    <rect x="23" y="25" width="2" height="3" rx="1" fill="#FDE047"/>
  </g>
</svg>
