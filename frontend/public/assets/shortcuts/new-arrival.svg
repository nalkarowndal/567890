<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scNewBoxGrad" x1="14" y1="16" x2="34" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="scNewGold" x1="20" y1="10" x2="36" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="scNewDrop" x="6" y="6" width="36" height="38" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#scNewDrop)">
    <!-- Package Box Body -->
    <path d="M13 22 L35 22 L33 41 C33 42 32 43 30 43 L18 43 C16 43 15 42 15 41 Z" fill="url(#scNewBoxGrad)"/>
