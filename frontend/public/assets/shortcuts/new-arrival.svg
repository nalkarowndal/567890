    <rect x="22" y="17" width="4" height="26" fill="url(#scNewGold)"/>
    <rect x="11" y="19" width="26" height="2.5" fill="url(#scNewGold)"/>

    <!-- Clock / Sunburst Symbol -->
    <circle cx="35" cy="16" r="6" fill="#F59E0B"/>
    <circle cx="35" cy="16" r="4.5" fill="#FEF3C7"/>
    <path d="M35 13.5 V16.5 H37.5" stroke="#92400E" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M12 12 L13 14 L15 15 L13 16 L12 18 L11 16 L9 15 L11 14 Z" fill="#F59E0B"/>
