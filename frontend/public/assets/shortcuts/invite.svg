<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scInviteEnv" x1="10" y1="14" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="scInviteFlap" x1="10" y1="14" x2="38" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>
    <linearGradient id="scInviteSeal" x1="20" y1="20" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="scInviteDrop" x="6" y="10" width="36" height="32" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#BE123C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#scInviteDrop)">
    <!-- Envelope Body -->
    <rect x="9" y="15" width="30" height="20" rx="3.5" fill="url(#scInviteEnv)" stroke="#FDA4AF" stroke-width="1.2"/>
    
    <!-- Envelope Lower Fold Lines -->
    <path d="M9 34 L21 24 M39 34 L27 24" stroke="#FDA4AF" stroke-width="1" stroke-linecap="round"/>

    <!-- Flap Triangle -->
    <path d="M9 16.5 L22.8 26.5 C23.5 27 24.5 27 25.2 26.5 L39 16.5" fill="url(#scInviteFlap)" stroke="#FDA4AF" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Wax Seal Badge with Heart -->
    <circle cx="24" cy="26" r="4.5" fill="url(#scInviteSeal)"/>
    <circle cx="24" cy="26" r="3.2" fill="#E11D48"/>
    <!-- Tiny Gold Heart -->
    <path d="M24 28 C24 28 22 26.5 22 25.2 C22 24.3 22.8 24 23.5 24.5 C24 24.9 24 24.9 24 24.9 C24 24.9 24 24.9 24.5 24.5 C25.2 24 26 24.3 26 25.2 C26 26.5 24 28 24 28 Z" fill="#FDE047"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M37 10 L38 12.5 L40.5 13.5 L38 14.5 L37 17 L36 14.5 L33.5 13.5 L36 12.5 Z" fill="#F59E0B"/>
</svg>
